services:
  slimevr-database:
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: slimevr
      PGUSER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: slimevr
    volumes:
      - database-volume:/var/lib/postgresql
    networks:
      - slimevr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 1m
      timeout: 5s
      start_period: 2m
      start_interval: 1s
      retries: 5
  slimevr-api:
    build:
      context: .
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      slimevr-database:
        condition: service_healthy
      slimevr-api-s3:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./test:/app/test
      - cache-volume:/app/cache
    networks:
      - slimevr-network
    secrets:
      - access_key
      - secret_key
    environment:
      APP_ENV: ${APP_ENV}
      LISTEN_HOST: ${LISTEN_HOST}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUILDS_BUCKET: ${S3_BUILDS_BUCKET}
      GITHUB_AUTH: ${GITHUB_AUTH}
      HOST_URL: ${HOST_URL}
      CACHE_DIR: /app/cache
  slimevr-api-s3:
    image: rustfs/rustfs:latest
    ports:
      - 127.0.0.1:9099:9099
    volumes:
      - storage-rustfs:/data
    secrets:
      - access_key
      - secret_key
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9099
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9000
      RUSTFS_CORS_ALLOWED_ORIGINS: ${HOST_URL}
      RUSTFS_ACCESS_KEY_FILE: /run/secrets/access_key
      RUSTFS_SECRET_KEY_FILE: /run/secrets/secret_key
    restart: unless-stopped
    networks:
      - slimevr-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9099/health"]
      interval: 1m
      timeout: 5s
      start_period: 2m
      start_interval: 1s
      retries: 5
  slimevr-api-s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      slimevr-api-s3:
        condition: service_healthy
    networks:
      - slimevr-network
    secrets:
      - access_key
      - secret_key
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export AWS_ACCESS_KEY_ID="$$(cat /run/secrets/access_key)"
        export AWS_SECRET_ACCESS_KEY="$$(cat /run/secrets/secret_key)"
        export AWS_DEFAULT_REGION=us-east-1
        s3="aws --endpoint-url http://slimevr-api-s3:9099"
        bucket=slimevr-firmware-builds
        $$s3 s3api head-bucket --bucket "$$bucket" 2>/dev/null || $$s3 s3api create-bucket --bucket "$$bucket"
        $$s3 s3api put-bucket-policy --bucket "$$bucket" --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::slimevr-firmware-builds/*"]}]}'

volumes:
  database-volume:
  storage-rustfs:
    external: false
  cache-volume:
    external: false

secrets:
  access_key:
    file: ./docker/minio/access_key.txt
  secret_key:
    file: ./docker/minio/secret_key.txt

networks:
  slimevr-network:
